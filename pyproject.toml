[project]
name = "streetclip"
version = "0.1.0"
description = "Auto-extract upload-ready shorts from long-form street preaching video"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
groq = ["groq>=0.13"]
local-whisper = ["faster-whisper>=1.1"]

[project.scripts]
streetclip = "streetclip.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streetclip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
