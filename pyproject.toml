[project]
name = "streetclip"
version = "0.1.0"
description = "Auto-extract upload-ready shorts from long-form street preaching video"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "argon2-cffi>=23.1",
    "email-validator>=2.0",
]

[project.optional-dependencies]
groq = ["groq>=0.13"]
local-whisper = ["faster-whisper>=1.1"]
# Speaker tracking for the 9:16 reframe. Without these, rendering still works
# but falls back to a fixed center crop.
reframe = ["mediapipe>=0.10", "pillow>=11.0"]

[project.scripts]
streetclip = "streetclip.cli:main"
streetclip-server = "streetclip.api:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streetclip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Cookie()/Query() in defaults is the framework's core
# idiom, not the mutable-default bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Cookie",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]
